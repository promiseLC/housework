[project]
name = "household-pay-backend"
version = "0.1.2"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<0.116", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "pymysql>=1.1,<2", "alembic>=1.13,<2", "pydantic>=2,<3", "pydantic-settings>=2,<3", "argon2-cffi>=23", "PyJWT>=2,<3", "cryptography>=43"]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "pyyaml>=6", "jsonschema>=4", "anyio>=4.6,<4.10", "ruff>=0.17,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
